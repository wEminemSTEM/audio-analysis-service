[project]
name = "audio-analysis-service"
version = "0.1.0"
description = "Upload audio files, analyze them (tempo, beats, spectral features), and serve the results to a visualizer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.149",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.15",      # used by FastAPI's TestClient
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
